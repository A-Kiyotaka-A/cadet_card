<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وزارة الدفاع الوطني - بطاقة الشبل</title>
    
    <!-- أيقونة علامة التبويب (Favicon) -->
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- استدعاء خط Cairo و Amiri -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #838c87;
            direction: rtl;
        }

        /* الحاوية الرئيسية الشاملة */
        .site-container {
            width: 85%;
            max-width: 1200px;
            min-width: 960px;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.3);
        }

        /* ===== الهيدر النظيف والمعدل ===== */
        .header {
            width: 100%;
            height: 140px;
            background-color: #ffffff;
            background-image: url('images/header-bg.jpg');
            background-repeat: no-repeat;
            background-position: center; 
            background-size: 100% 100%;
            position: relative;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 30px;
        }

        /* أزرار الهيدر على اليسار */
        .header-buttons {
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .header-buttons .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #1b4332;
            border: 2px solid #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            text-decoration: none;
        }

        .header-buttons .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: white;
            stroke-width: 2.5;
        }

        .header-buttons .icon-btn.text-btn {
            font-size: 14px;
            font-weight: 700;
            color: white;
            font-family: 'Cairo', sans-serif;
        }

        /* ===== شريط التنقل ===== */
        .navbar {
            width: 100%;
            height: 42px;
            background-color: #1b4332;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            direction: rtl;
            border-bottom: 3px solid #8b0000;
            padding: 0 10px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            padding: 0 16px;
            height: 100%;
            display: flex;
            align-items: center;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.3s;
        }

        .navbar a:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* ===== المحتوى الرئيسي ===== */
        .main-content {
            width: 100%;
            background-color: #f1f3f2;
            min-height: 500px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            width: 100%;
            text-align: right;
            color: #8b0000;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 25px;
            border-bottom: 2px solid #1b4332;
            padding-bottom: 8px;
        }

        /* ===== بطاقة الشبل الرسمية ===== */
        .cadet-card {
            width: 620px;
            background: linear-gradient(135deg, #2d5a44 0%, #1e3a2c 100%);
            border: 2px solid #c5a059;
            border-radius: 14px;
            padding: 22px 25px;
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            position: relative;
            margin: 20px 0;
            overflow: hidden;
        }

        .cadet-card::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
        }

        .card-header-title {
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 28px;
            color: #f3e5ab;
            letter-spacing: 1px;
            margin-bottom: 16px;
            border-bottom: 1px dashed rgba(197, 160, 89, 0.5);
            padding-bottom: 6px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        .card-body {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px;
            position: relative;
            z-index: 2;
        }

        .photo-frame {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            border: 3px solid #c5a059;
            background-color: #ffffff;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-row {
            font-size: 15px;
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.08);
            padding: 5px 12px;
            border-radius: 6px;
            border-right: 3px solid #c5a059;
        }

        .info-label {
            color: #f3e5ab;
            font-weight: 700;
            width: 120px;
            font-size: 14px;
        }

        .info-val {
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        .card-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
            z-index: 2;
        }

        .school-info {
            text-align: right;
            line-height: 1.5;
        }

        .school-info .school-name {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            font-family: 'Amiri', serif;
        }

        .school-info .region-name {
            color: #f3e5ab;
            font-size: 14px;
            font-weight: 700;
        }

        .barcode-box {
            width: 150px;
            height: 52px;
            background-color: #ffffff;
            border: 2px solid #c5a059;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .barcode-box img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .footer-space {
            height: 35px;
            background-color: #1b4332;
        }
    </style>
</head>
<body>

    <div class="site-container">

        <!-- الهيدر المعدل -->
        <header class="header">
            <div class="header-buttons">
                <a href="https://www.mdn.dz/site_principal/index.php?L=ar#rss" target="_blank" class="icon-btn" title="RSS">
                    <svg viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16M6 19a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>
                </a>
                <a href="https://www.mdn.dz/site_principal/index.php?L=en" target="_blank" class="icon-btn text-btn" title="English">En</a>
                <a href="https://www.mdn.dz/site_principal/index.php?L=fr" target="_blank" class="icon-btn text-btn" title="Français">Fr</a>
                <a href="https://www.mdn.dz/site_principal/index.php?L=ar" target="_blank" class="icon-btn" title="الرئيسية">
                    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10"/></svg>
                </a>
            </div>
        </header>

        <!-- شريط التنقل -->
        <nav class="navbar">
            <a href="https://www.mdn.dz/site_principal/index.php?L=ar#presentation" target="_blank">تقديم</a>
            <a href="https://www.mdn.dz/site_principal/index.php?L=ar#actualites" target="_blank">مستجدات</a>
            <a href="https://www.mdn.dz/site_principal/index.php?L=ar#publications" target="_blank">منشورات</a>
            <a href="https://preinscription.mdn.dz/" target="_blank">التجنيد والتكوين</a>
            <a href="https://www.mdn.dz/site_principal/index.php?L=ar#service_national" target="_blank">الخدمة الوطنية</a>
            <a href="https://www.mdn.dz/site_principal/index.php?L=ar#offres" target="_blank">عروض ومنتوجات</a>
            <a href="https://www.mdn.dz/site_principal/index.php?L=ar#sport" target="_blank">رياضة</a>
            <a href="https://www.mdn.dz/site_principal/index.php?L=ar#archives" target="_blank">أرشيف</a>
        </nav>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            <h2 class="section-title">الشبل : انس سيف الدين زديرة</h2>

            <div class="cadet-card">
                <div class="card-header-title">بطاقة الشبل</div>
                
                <div class="card-body">
                    <div class="photo-frame">
                        <img src="images/cadet-photo.jpg" alt="صورة الشبل">
                    </div>

                    <div class="info-group">
                        <div class="info-row">
                            <span class="info-label">الشبل:</span>
                            <span class="info-val">انس سيف الدين زديرة</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">تاريخ الميلاد:</span>
                            <span class="info-val">12 جانفي 2011</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">مكان الميلاد:</span>
                            <span class="info-val">تبسة</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">الرقم التسلسلي:</span>
                            <span class="info-val">711</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">فصيلة الدم:</span>
                            <span class="info-val">A+</span>
                        </div>
                    </div>
                </div>

                <div class="card-footer">
                    <div class="barcode-box">
                        <img src="images/barcode.png" alt="الرمز المشفر للبطاقة">
                    </div>

                    <div class="school-info">
                        <div class="school-name">ثانوية الشهيد زعيط حمود</div>
                        <div class="region-name">الناحية العسكرية الأولى - البليدة</div>
                    </div>
                </div>
            </div>
        </main>

        <div class="footer-space"></div>

    </div>

</body>
</html>
